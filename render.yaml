      # WHATSAPP_API_URL=https://baileys-api-relat-rios.onrender.com
      # WHATSAPP_DESTINATION=5511922048764 (ou múltiplos separados por vírgula)
      # REPORT_TIMES=10:00,14:00,17:00,19:15
      # PORT será definido automaticamente pelo Render

