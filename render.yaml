services:
  - type: web
    name: reportsday-backend
    env: node
    region: sao-paulo
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # IMPORTANTE: Adicione as outras variáveis de ambiente no painel do Render:
